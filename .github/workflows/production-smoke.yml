name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'
  push:
    branches: [ main ]

jobs:
  smoke:
    # ubuntu-latest is Ubuntu 26.04; Playwright 1.58.2 cannot install Chromium there.
    runs-on: ubuntu-24.04
    env:
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL || 'https://giant-schrodinger.vercel.app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Production smoke
        run: npm run smoke:production

      - name: Deployed rehearsal E2E
        run: npm run test:e2e:rehearsal
        env:
          PRODUCTION_URL: ${{ env.PRODUCTION_URL }}
