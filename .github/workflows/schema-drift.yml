name: Schema Drift Check
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-schema-drift.mjs
